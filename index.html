
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories</title>

<style>
body {
  background: #e8e6dc;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: Georgia, serif;
}

.stack {
  position: relative;
  width: 280px;
  height: 350px;
}

.photo {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 10px solid white;
  border-bottom: 35px solid white;
  border-radius: 4px;
  box-sizing: border-box;
  box-shadow: 0 5px 18px #0003;
  cursor: pointer;
  transition: transform 0.7s ease, opacity 0.7s ease;
}

.photo.fly {
  transform: translate(600px, -80px) rotate(35deg);
  opacity: 0;
  pointer-events: none;
}

.hint {
  text-align: center;
  color: #65735c;
  margin-top: 25px;
  font-style: italic;
}
</style>
</head>

<body>

<div>
  <div class="stack" id="stack">
    <img class="photo" src="IMG_0206.jpeg">
    <img class="photo" src="IMG_3990.jpeg">
    <img class="photo" src="IMG_4754.jpeg">
    <img class="photo" src="IMG_9039.jpeg">
  </div>

  <p class="hint">Click to reveal our memories ♡</p>
</div>

<script>
const photos = document.querySelectorAll(".photo");

photos.forEach((photo, index) => {
  photo.style.zIndex = photos.length - index;

  photo.addEventListener("click", () => {
    if (photo.classList.contains("fly")) return;

    photo.classList.add("fly");
    photo.style.zIndex = 100;
  });
});
</script>

</body>
</html>
